<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1A17" media="(prefers-color-scheme: dark)">
<title>今天吃什么</title>

<!-- PWA：装到手机主屏（iOS Safari「添加到主屏幕」/ Android Chrome「安装应用」） -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今天吃什么">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>
<div class="app" id="app"></div>

<!-- 数据：manifest 静态引入（摘要常驻），分类文件按需动态注入 -->
<script src="data/manifest.js"></script>

<!-- 应用（顺序敏感：icons → db → data → random → ui → screens → app） -->
<script src="js/icons.js"></script>
<script src="js/db.js"></script>
<script src="js/data.js"></script>
<script src="js/random.js"></script>
<script src="js/ui.js"></script>
<script src="js/screens/home.js"></script>
<script src="js/screens/result.js"></script>
<script src="js/screens/detail.js"></script>
<script src="js/screens/steps.js"></script>
<script src="js/screens/library.js"></script>
<script src="js/screens/records.js"></script>
<script src="js/screens/profile.js"></script>
<script src="js/app.js"></script>

<!-- PWA：只在 http(s) 下注册 Service Worker（APK 内的 WebView 壳不需要） -->
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  if (location.hostname === 'app.local') return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
})();
</script>
</body>
</html>
