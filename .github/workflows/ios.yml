name: Build iOS App (unsigned IPA)

# 在 GitHub 的免费 macOS runner 上把 Capacitor iOS 工程编译成**未签名 IPA**。
# 未签名 IPA 不能直接装 —— 需要用 Sideloadly / AltStore 拿你自己的 Apple ID 签名后安装，
# 详见 docs/ios-build-guide.md 的「路线二」。
#
# 为什么不签名：签 IPA 需要 Apple 开发者证书（$99/年），
# 免费 Apple ID 签名只能在你的电脑上、用你的账号现场做，不可能放进 CI。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/ios.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: |
          npm install
          npm install @capacitor/ios@^6.0.0
          npm install --no-save @capacitor/assets

      - name: 生成 iOS 工程（含 pod install）
        run: npx cap add ios

      - name: 生成图标与启动图
        run: |
          npx @capacitor/assets generate --ios || echo "::warning::assets 生成失败，改用 Capacitor 默认图标继续"
          echo "--- AppIcon 目录抽查 ---"
          ls ios/App/App/Assets.xcassets/AppIcon.appiconset/ 2>/dev/null | head -20 || echo "没有 AppIcon.appiconset"

      - name: 同步 web 资源到 ios/App/App/public
        run: npx cap sync ios

      - name: 对齐版本号与屏幕方向（与 Android 保持一致）
        run: |
          PLIST=ios/App/App/Info.plist
          plutil -replace CFBundleShortVersionString -string "3.1.0" "$PLIST"
          plutil -replace CFBundleVersion -string "31" "$PLIST"
          plutil -replace CFBundleDisplayName -string "今天吃什么" "$PLIST"
          plutil -replace UISupportedInterfaceOrientations -json '["UIInterfaceOrientationPortrait"]' "$PLIST"
          plutil -replace 'UISupportedInterfaceOrientations~ipad' -json '["UIInterfaceOrientationPortrait"]' "$PLIST" || true
          echo "--- 结果 ---"
          plutil -p "$PLIST" | grep -E "CFBundle|Orientation" || true

      - name: 编译（禁用签名）
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION=3.1.0 \
            CURRENT_PROJECT_VERSION=31 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包未签名 IPA
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry chishenme-ios-unsigned.ipa Payload
          ls -lh chishenme-ios-unsigned.ipa
          echo "--- 包内抽查 ---"
          unzip -l chishenme-ios-unsigned.ipa | head -12

      - name: 上传为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: chishenme-ios-unsigned-ipa
          path: chishenme-ios-unsigned.ipa
          retention-days: 30

      - name: 挂到最新 Release（存在才传）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          if [ -n "$TAG" ]; then
            gh release upload "$TAG" chishenme-ios-unsigned.ipa --clobber
            echo "已上传到 Release $TAG"
          else
            echo "没有 Release，跳过"
          fi
